# puppetterm — self-hosted web deployment.
#
#   docker compose up -d --build          → serve on http://localhost:8080
#   PUPPETTERM_BASIC_AUTH=me:secret docker compose up -d   → with basic auth
#
# Your SSH setup is mounted READ-ONLY at /ssh-in and copied by the entrypoint
# into the container's own ~/.ssh (writable named volume), so the app can use
# your keys/config exactly like the desktop version without ever writing to
# the host's files.
services:
  puppetterm:
    build: .
    image: puppetterm:latest
    container_name: puppetterm
    restart: unless-stopped
    ports:
      - "${PUPPETTERM_PORT:-8080}:8080"
    environment:
      # user:pass — REQUIRED in anything but a trusted LAN. Leave unset to run
      # open (the server logs a loud warning).
      PUPPETTERM_BASIC_AUTH: "${PUPPETTERM_BASIC_AUTH:-}"
      PUPPETTERM_PORT: "8080"
      # Optional: point the AI client at a provider without UI setup.
      # PUPPETTERM_AI_BASE_URL / PUPPETTERM_AI_MODEL / PUPPETTERM_AI_API_KEY /
      # PUPPETTERM_AI_PROVIDER
    volumes:
      # Read-only view of your existing SSH setup.
      - "${PUPPETTERM_SSH_DIR:-$HOME/.ssh}:/ssh-in:ro"
      # Writable ~/.ssh inside the container (known_hosts, mux sockets).
      - puppetterm-ssh:/home/pp/.ssh
      # AI config + audit db + pinned machine-id (survives rebuilds).
      - puppetterm-config:/home/pp/.config/puppetterm
volumes:
  puppetterm-ssh:
  puppetterm-config:
