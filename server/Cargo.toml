[package]
name = "puppetterm-server"
version = "0.1.0"
description = "puppetterm — headless web server (SSH terminal + AI over HTTP/WebSocket)"
authors = ["Jan Bas"]
license = "MIT"
edition = "2021"

[dependencies]
puppetterm-core = { path = "../core" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
